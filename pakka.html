<!DOCTYPE html>

<head>
    <title>Pakka</title>
    <link rel="stylesheet" href="CSS/pakkastyle.css">
</head>

<body>

    <div class="topBar">
        <a href="index.html" class="EKPLogo">
            <img src="Images/Icons/EKP_logo.png" alt="logo">
            <span>EKP</span>
        </a>
    </div>

    <h1 id="Pakka_nimi"></h1>
    <h2 id="Pakka_pelaaja"></h2>
    <h1 id="Pakka_voitot"></h1>

    <div class="vertical_split">
        <div id="left">
            <div id="pakanKortit">
            </div>
        </div>
        <div id="right">
            <div id="pakanStatut">
                <div>
                    <h2>Pakan Korttityypit</h2>
                    <canvas id="cardtypePie" width="300" height="300"></canvas>
                </div>
                <div>
                    <h2>Pakan Lajijakauma</h2>
                    <canvas id="creaturetypePie" width="300" height="300"></canvas>
                </div>
                <div>
                    <h2>Pakan Manakurvi</h2>
                    <canvas id="maksuChart" width="300" height="300"></canvas>
                </div>
            </div>
        </div>
    </div>
    <div id="cardZoom">
        <div id="zoomContent">
            <img id="zoomImage" src="" alt="">
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="JS/pakka.js"></script>
    <script>
        loadDeck()
    </script>
</body>

</html>
