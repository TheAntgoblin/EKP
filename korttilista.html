<!DOCTYPE html>

    <title> EKP_Cardlist </title>
    <meta charset="UTF-8">
</head>

<body>

        </a>

        <div class="searchOptions">

            <div class="maksuButtonGroup">

    <div class="cartTab">

                <button id="KasviQuick" onclick="location.href='#Kasvi'">Kasvi</button>

                <button id="KoneQuick" onclick="location.href='#Kone'">Kone</button>
                <button id="MutanttiQuick" onclick="location.href='#Mutantti'">Mutantti</button>
                <button id="SähköQuick" onclick="location.href='#Sähkö'">Sähkö</button>

                <button id="SilmäQuick" onclick="location.href='#Silmä'">Silmä</button>
                <button id="TuliQuick" onclick="location.href='#Tuli'">Tuli</button>
                <button id="VesiQuick" onclick="location.href='#Vesi'">Vesi</button>

                <button id="ÖtökkäQuick" onclick="location.href='#Ötökkä'">Ötökkä</button>

                <button id="PysyväQuick" onclick="location.href='#Pysyvä'">Pysyvä Loitsu</button>
            </div>
            <div class="deckNameField">
                <label for="Pakannimi">Pakan Nimi:</label>
                <input type="text" id="Pakannimi" placeholder="Kirjoita pakan nimi">

            </div>
            <h1 id="pakka">Pakka (0/40)</h1>
            <div class="listCart" id="listCart">

            <h2 id="side">Sideboard (0/10)</h2>

            </div>

        </div>

        <button class="kopioi" onclick="copyCards()">Kopioi Pakka</button>

    </div>

    <div class="pageContent">
        <div class="setSelector">
            <img src="Images/Icons/Setti1.jpg" class="setButton" onclick="selectSet('Setti1.jpg')" id="Setti1.jpgBtn">
            <img src="Images/Icons/Vanha.jpg" class="setButton" onclick="selectSet('Vanha.jpg')" id="Vanha.jpgBtn">
            <img src="Images/Icons/Keski.jpg" class="setButton" onclick="selectSet('Keski.jpg')" id="Keski.jpgBtn">
            <img src="Images/Icons/Uusi.jpg" class="setButton" onclick="selectSet('Uusi.jpg')" id="Uusi.jpgBtn">
            <img src="Images/Icons/Tähti.jpg" class="setButton" onclick="selectSet('Tähti.jpg')" id="Tähti.jpgBtn">
            <img src="Images/Icons/Raha.jpg" class="setButton" onclick="selectSet('Raha.jpg')" id="Raha.jpgBtn">
        </div>

        <h2 id="Demoni">Demoni</h2>
        <div id="DemoniKortit"></div>

        <h2 id="Eläin">Eläin</h2>
        <div id="EläinKortit"></div>

        <h2 id="Enkeli">Enkeli</h2>
        <div id="EnkeliKortit"></div>

        <h2 id="Epäkuollut">Epäkuollut</h2>
        <div id="EpäkuollutKortit"></div>

        <h2 id="Ihminen">Ihminen</h2>
        <div id="IhminenKortit"></div>

        <h2 id="Kasvi">Kasvi</h2>
        <div id="KasviKortit"></div>

        <h2 id="Kone">Kone</h2>
        <div id="KoneKortit"></div>

        <h2 id="Mutantti">Mutantti</h2>
        <div id="MutanttiKortit"></div>

        <h2 id="Sähkö">Sähkö</h2>
        <div id="SähköKortit"></div>

        <h2 id="Silmä">Silmä</h2>
        <div id="SilmäKortit"></div>

        <h2 id="Tuli">Tuli</h2>
        <div id="TuliKortit"></div>

        <h2 id="Vesi">Vesi</h2>
        <div id="VesiKortit"></div>

        <h2 id="Ötökkä">Ötökkä</h2>
        <div id="ÖtökkäKortit"></div>

        <h2 id="Loitsu">Loitsu</h2>
        <div id="LoitsuKortit"></div>

        <h2 id="Pysyvä">Pysyvä Loitsu</h2>
        <div id="PysyväKortit"></div>


    </div>
    <div id="cardZoom">
        <div id="zoomContent">
            <img id="zoomImage" src="" alt="">
        </div>
    </div>

    <script src="JS/korttilista.js"></script>
    <script>
        drawcards("Demoni");
        drawcards("Eläin");
        drawcards("Enkeli");
        drawcards("Epäkuollut");
        drawcards("Ihminen");
        drawcards("Kasvi");
        drawcards("Kone");
        drawcards("Mutantti");
        drawcards("Sähkö");
        drawcards("Silmä");
        drawcards("Tuli");
        drawcards("Vesi");
        drawcards("Ötökkä");
        drawcards("Loitsu");
        drawcards("Pysyvä");
        document.getElementById("Setti1.jpgBtn").classList.add("active");

    </script>

    <script>
        document.getElementById("listCart").addEventListener("click", function (e) {
            const btn = e.target;

            if (!btn.classList.contains("plus") && !btn.classList.contains("minus")) return;

            const item = btn.closest(".item");
            const qtySpan = item.querySelector(".quantity span:nth-child(2)");
            let qty = parseInt(qtySpan.textContent);

            const maxValue = parseInt(item.dataset.max);

            if (btn.textContent === "+") {
                if (qty < maxValue) qtySpan.textContent = qty + 1;

            } else if (btn.textContent === "-") {
                if (qty > 1) {
                    qtySpan.textContent = qty - 1;
                } else {
                    item.remove();
                }
            }
            updateTotal();
        });

        document.getElementById("sideBoard").addEventListener("click", function (e) {
            const btn = e.target;

            if (!btn.classList.contains("plus") && !btn.classList.contains("minus")) return;

            const item = btn.closest(".item");
            const qtySpan = item.querySelector(".quantity span:nth-child(2)");
            let qty = parseInt(qtySpan.textContent);

            const maxValue = parseInt(item.dataset.max);

            if (btn.textContent === "+") {
                if (qty < maxValue) qtySpan.textContent = qty + 1;

            } else if (btn.textContent === "-") {
                if (qty > 1) {
                    qtySpan.textContent = qty - 1;
                } else {
                    item.remove();
                }
            }
            updateTotal();
        });
    </script>

</body>

</html>
